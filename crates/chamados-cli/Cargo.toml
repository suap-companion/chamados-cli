[package]
name = "chamados-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chamados"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chamados-core = { path = "../chamados-core" }
chamados-sync = { path = "../chamados-sync" }
# Reads a secret from the terminal without echoing it (credentials prompt).
rpassword = "7"
# Builds the `--json` output (already part of the build through chamados-core).
serde_json = "1"
suap-core = { path = "../suap-core" }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
keyring-core = "1"
tempfile = "3"
wiremock = "0.6"
