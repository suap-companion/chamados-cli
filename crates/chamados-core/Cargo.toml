[package]
name = "chamados-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suap-core = { path = "../suap-core" }
thiserror = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
